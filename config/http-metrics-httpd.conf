# Privacy-preserving metrics log: epoch, final status and request duration only.
# It intentionally excludes client IP, host, URI, query, method, referer and user agent.
LogFormat "%{sec}t %>s %D" ops_toolkit_metrics
# Two circular 10 MiB files; -L exposes the current file to the sampler.
# Rotation marks a conservative evidence gap (unread records may be lost).
GlobalLog "|/usr/sbin/rotatelogs -f -n 2 -L /var/log/httpd/ops-toolkit-request-metrics.metrics -p /usr/local/libexec/ops-toolkit-http-metrics-rotation /var/log/httpd/ops-toolkit-request-metrics.ring 10M" ops_toolkit_metrics env=!ops_toolkit_internal_monitor
