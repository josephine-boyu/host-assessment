# Local-only PHP-FPM status endpoint for ops-toolkit.
# The listener is bound to loopback and never exposes the status page publicly.
Listen 127.0.0.1:9081

<VirtualHost 127.0.0.1:9081>
    ServerName localhost
    ProxyRequests Off
    SetEnv ops_toolkit_internal_monitor 1

    <Location "/ops-toolkit-fpm-status">
        Require local
        SetHandler "proxy:unix:__PHP_FPM_SOCKET__|fcgi://localhost"
    </Location>

    <LocationMatch "^/(?!ops-toolkit-fpm-status$)">
        Require all denied
    </LocationMatch>

    ErrorLog /var/log/httpd/ops-toolkit-fpm-status-error.log
    CustomLog /dev/null common
</VirtualHost>
